<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#2B2D42', PAPER = '#F5F0E6', RED = '#E1352C', YEL = '#FFC83A', GHOST = '#7d7d82';
let TL = null, T = 0, BOIL = 0;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeBack = k => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

// flat cartoon background (made once): sky, sun, clouds, skyline
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(() => {
  const p = paper.getContext('2d');
  const g = p.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8ED1FC'); g.addColorStop(.7, '#CDEBFF'); g.addColorStop(1, '#E8F6FF');
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  p.fillStyle = '#FFE066'; p.beginPath(); p.arc(880, 330, 90, 0, 7); p.fill();
  p.fillStyle = 'rgba(255,255,255,.95)';
  for (const [x, y, k] of [[180, 520, 1], [760, 610, .8], [420, 380, .6]]) { for (const [dx, dy, r] of [[0, 0, 60], [55, -25, 70], [115, 0, 55], [55, 15, 60]]) { p.beginPath(); p.arc(x + dx * k, y + dy * k, r * k, 0, 7); p.fill(); } }
  const cols = ['#B8C5E0', '#A7B6D6', '#C3CEE6'];
  let x = -20; let i = 0;
  while (x < W) { const w = 90 + (i * 37) % 70, h = 220 + (i * 53) % 260; p.fillStyle = cols[i % 3]; p.fillRect(x, 1000 - h, w, h + 400);
    p.fillStyle = 'rgba(255,255,255,.45)'; for (let yy = 1000 - h + 25; yy < 980; yy += 48) for (let xx = x + 16; xx < x + w - 20; xx += 30) p.fillRect(xx, yy, 14, 22);
    x += w + 6; i++; }
})();
// hand-drawn wobble: points jitter, re-seeded 8x per second ("line boil")
function jit(x, y, k, amp = 3) { amp *= .15; return [x + (rnd(k * 3.1 + BOIL * 17.3) - .5) * amp * 2, y + (rnd(k * 7.7 + BOIL * 9.1) - .5) * amp * 2]; }
function inkPath(pts, { w = 8, color = INK, alpha = 1, dash = null, amp = 2.5, close = false, fill = null, seed = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = w; ctx.strokeStyle = color;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  const J = pts.map((p, i) => jit(p[0], p[1], seed + i, amp));
  ctx.moveTo(J[0][0], J[0][1]);
  for (let i = 1; i < J.length; i++) {
    const [x0, y0] = J[i - 1], [x1, y1] = J[i];
    const mx = (x0 + x1) / 2 + (rnd(seed * 5 + i + BOIL) - .5) * amp * .3, my = (y0 + y1) / 2 + (rnd(seed * 9 + i + BOIL) - .5) * amp * .3;
    ctx.quadraticCurveTo(mx, my, x1, y1);
  }
  if (close) ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.stroke(); ctx.restore();
}
function inkCircle(cx, cy, r, o = {}) {
  const n = 20, pts = [];
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  inkPath(pts, { ...o, amp: o.amp ?? 2.2 });
}
function dot(x, y, r, color = INK, alpha = 1) { ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }
function text(s, x, y, size, { color = INK, align = 'center', stroke = null, sw = 0, weight = 900, alpha = 1, font = "'Inter Display'" } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- stick figure ----------
// pose angles: 0 = straight down, + = toward +x. limbs are [upper, lower].
const STAND = { armL: [-.35, -.15], armR: [.35, .15], legL: [-.16, -.16], legR: [.16, .16] };
function limb(x, y, ang, L) { const a = [x + Math.sin(ang[0]) * L, y + Math.cos(ang[0]) * L]; const b = [a[0] + Math.sin(ang[1]) * L, a[1] + Math.cos(ang[1]) * L]; return [[x, y], a, b]; }
// v: 0 solid .. 1 invisible (ghost dashed)
const PAL = { hero: { top: '#FF5A5F', pants: '#3D5A80', skin: '#FFD3B5', hair: '#4A2C2A' },
  21: { top: '#2A9D8F', pants: '#264653', skin: '#C68B59', hair: '#1B1B1B' }, 31: { top: '#F4A261', pants: '#264653', skin: '#FFE0C2', hair: '#6B4226' },
  41: { top: '#6C63FF', pants: '#2B2D42', skin: '#8D5524', hair: '#111' }, 51: { top: '#FFB703', pants: '#3A3A55', skin: '#FFD3B5', hair: '#B5651D' } };
function figure(x, y, s, o = {}) {
  const pose = { ...STAND, ...(o.pose || {}) }, v = o.v ?? 0, seed = o.seed ?? 10;
  const c = o.scarf === false ? (PAL[seed] || PAL[41]) : PAL.hero;
  const thigh = 62 * s, arm = 52 * s, body = 120 * s, r = 46 * s;
  const hip = [x, y], neck = [x + (o.lean || 0) * s, y - body], head = [neck[0], neck[1] - r + 4 * s];
  const sh = [neck[0], neck[1] + 16 * s];
  const L = { legL: limb(hip[0] - 12 * s, hip[1], pose.legL, thigh), legR: limb(hip[0] + 12 * s, hip[1], pose.legR, thigh), armL: limb(sh[0] - 22 * s, sh[1], pose.armL, arm), armR: limb(sh[0] + 22 * s, sh[1], pose.armR, arm) };
  const OUT = INK, lw = 26 * s, ow = 6 * s;
  const seg = (pts, col) => { for (const [w, cc] of [[lw + ow * 2, OUT], [lw, col]]) { ctx.lineWidth = w; ctx.strokeStyle = cc; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.lineTo(...pts[2]); ctx.stroke(); } };
  const circ = (cx, cy, rr, col) => { ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(cx, cy, rr + ow, 0, 7); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill(); };
  const drawBody = () => {
    seg(L.legL, c.pants); seg(L.legR, c.pants);
    for (const k of ['legL', 'legR']) { const f = L[k][2]; ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(f[0] + (k === 'legL' ? -8 : 8) * s, f[1] + 6 * s, 24 * s, 13 * s, 0, 0, 7); ctx.fill(); }
    seg(L.armL, c.top); seg(L.armR, c.top);
    for (const k of ['armL', 'armR']) { const h = L[k][2]; circ(h[0], h[1], 13 * s, c.skin); }
    // torso
    ctx.fillStyle = OUT; rrect(neck[0] - 40 * s - ow, neck[1] - ow, 80 * s + ow * 2, body + 18 * s + ow * 2, 30 * s); ctx.fill();
    ctx.fillStyle = c.top; rrect(neck[0] - 40 * s, neck[1], 80 * s, body + 18 * s, 26 * s); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; rrect(neck[0] - 40 * s, neck[1] + body * .62, 80 * s, body * .38 + 18 * s, 26 * s); ctx.fill();
    // head + hair
    circ(head[0], head[1], r, c.skin);
    ctx.fillStyle = c.hair; ctx.beginPath(); ctx.arc(head[0], head[1] - 6 * s, r * .98, Math.PI * 1.03, Math.PI * 1.97); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(head[0] + r * .35, head[1] - r * .82, r * .32, 0, 7); ctx.fill();
    if (o.scarf !== false) { // hero's signature: little red cap brim
      ctx.fillStyle = '#E63946'; ctx.beginPath(); ctx.arc(head[0], head[1] - 10 * s, r * 1.02, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill();
      ctx.fillRect(head[0] - 6 * s, head[1] - 22 * s, r * 1.25, 12 * s); }
    // face
    const lx = (o.look?.[0] || 0) * r * .2, ly = (o.look?.[1] || 0) * r * .2;
    if (o.eyes === 'x') { for (const ex of [-.38, .38]) { const cx = head[0] + ex * r + lx, cy = head[1] + .02 * r + ly, k = .14 * r; ctx.strokeStyle = OUT; ctx.lineWidth = 5 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy + k); ctx.moveTo(cx - k, cy + k); ctx.lineTo(cx + k, cy - k); ctx.stroke(); } }
    else if (o.eyes === 'closed') { for (const ex of [-.38, .38]) { const cx = head[0] + ex * r, cy = head[1] + .05 * r; ctx.strokeStyle = OUT; ctx.lineWidth = 5 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy - .08 * r, .14 * r, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); } }
    else for (const ex of [-.38, .38]) { const cx = head[0] + ex * r, cy = head[1] + .02 * r; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, cy, .2 * r, .25 * r, 0, 0, 7); ctx.fill(); ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(cx + lx * .6, cy + ly * .6, .11 * r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + lx * .6 + .04 * r, cy + ly * .6 - .04 * r, .035 * r, 0, 7); ctx.fill(); }
    const m = o.mouth || 'smile', mx = head[0] + lx * .5, my = head[1] + .45 * r + ly * .3;
    ctx.fillStyle = '#B5303A'; ctx.strokeStyle = OUT; ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
    if (m === 'smile') { ctx.beginPath(); ctx.arc(mx, my - .08 * r, .22 * r, .1 * Math.PI, .9 * Math.PI); ctx.closePath(); ctx.fill(); }
    else if (m === 'sad') { ctx.beginPath(); ctx.arc(mx, my + .14 * r, .18 * r, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); }
    else if (m === 'o') { ctx.beginPath(); ctx.ellipse(mx, my, .1 * r, .13 * r, 0, 0, 7); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(mx - .16 * r, my); ctx.lineTo(mx + .16 * r, my); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,120,120,.35)'; for (const ex of [-.62, .62]) { ctx.beginPath(); ctx.ellipse(head[0] + ex * r, head[1] + .32 * r, .13 * r, .08 * r, 0, 0, 7); ctx.fill(); }
  };
  ctx.save(); ctx.globalAlpha *= 1 - v * .9; drawBody(); ctx.restore();
  if (v > 0) { // invisible: glowing dashed outline + sparkles
    ctx.save(); ctx.globalAlpha *= v; ctx.setLineDash([14 * s, 12 * s]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5 * s; ctx.shadowColor = '#7FDBFF'; ctx.shadowBlur = 18 * s;
    ctx.beginPath(); ctx.arc(head[0], head[1], r + 4 * s, 0, 7); ctx.stroke();
    rrect(neck[0] - 44 * s, neck[1] - 4 * s, 88 * s, body + 26 * s, 30 * s); ctx.stroke();
    for (const k of ['legL', 'legR', 'armL', 'armR']) { ctx.beginPath(); ctx.moveTo(...L[k][0]); ctx.lineTo(...L[k][1]); ctx.lineTo(...L[k][2]); ctx.stroke(); }
    ctx.setLineDash([]); ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) { const a = rnd(i * 13 + BOIL) * 6.28, rr = (60 + rnd(i * 7 + BOIL) * 90) * s; const px = neck[0] + Math.cos(a) * rr, py = neck[1] + Math.sin(a) * rr * 1.2, k = (6 + rnd(i + BOIL) * 6) * s;
      ctx.beginPath(); ctx.moveTo(px, py - k * 2); ctx.lineTo(px + k * .5, py - k * .5); ctx.lineTo(px + k * 2, py); ctx.lineTo(px + k * .5, py + k * .5); ctx.lineTo(px, py + k * 2); ctx.lineTo(px - k * .5, py + k * .5); ctx.lineTo(px - k * 2, py); ctx.lineTo(px - k * .5, py - k * .5); ctx.fill(); }
    ctx.restore(); }
  return { head, neck, hip, r, hands: [L.armL[2], L.armR[2]] };
}
const walk = (ph, amt = 1) => ({ legL: [Math.sin(ph) * .45 * amt, Math.sin(ph) * .3 * amt], legR: [-Math.sin(ph) * .45 * amt, -Math.sin(ph) * .3 * amt], armL: [-Math.sin(ph) * .4 * amt - .1, -Math.sin(ph) * .3 * amt], armR: [Math.sin(ph) * .4 * amt + .1, Math.sin(ph) * .3 * amt] });

function burst(cx, cy, k, R = 160, color = INK, n = 10) {
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + .3, r0 = R * (.5 + .7 * easeOut(k)), r1 = r0 + 50 * (1 - k);
    inkPath([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], { w: 8, color, alpha: 1 - k, seed: 900 + i }); }
}
function hud(label, sub, alpha = 1, y = 190) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = INK; rrect(W / 2 - 230, y - 70, 460, 140, 34); ctx.fill();
  text(label, W / 2, y + 4, 92, { color: '#fff', font: "'DejaVu Sans Mono'", weight: 700 });
  if (sub) { ctx.fillStyle = RED; rrect(W / 2 - 120, y + 62, 240, 52, 18); ctx.fill(); text(sub, W / 2, y + 89, 32, { color: '#fff' }); }
  ctx.restore();
}
const fmt = secs => { secs = Math.max(0, Math.floor(secs)); const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60; return [h, m, s].map(v => String(v).padStart(2, '0')).join(':'); };
function ground(y, x0 = -20, x1 = W + 20, seed = 300) { if (seed === 300 || seed === 800) { ctx.save(); ctx.fillStyle = '#7BC96F'; ctx.fillRect(0, y, W, H - y); ctx.fillStyle = '#5FB15A'; ctx.fillRect(0, y, W, 26); ctx.restore(); } inkPath([[x0, y], [x1, y]], { w: 7, seed }); }
function bubble(x, y, s, txt, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; inkCircle(x, y, 62 * s, { w: 7, fill: '#fff', seed: 500 }); text(txt, x, y + 4, 80 * s, { alpha: 1 }); ctx.restore();
}

// ---------- helpers for this episode ----------
function box(x, y, w, h, r, col, ow = 8) { ctx.save(); ctx.fillStyle = INK; rrect(x - ow, y - ow, w + ow * 2, h + ow * 2, r + ow); ctx.fill(); ctx.fillStyle = col; rrect(x, y, w, h, r); ctx.fill(); ctx.restore(); }
function heart(x, y, s, col = '#FF4D6D') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 12); ctx.bezierCurveTo(-30, -10, -14, -34, 0, -18); ctx.bezierCurveTo(14, -34, 30, -10, 0, 12); ctx.fill(); ctx.restore(); }
function cloudShape(cx, cy, w, h, col) { ctx.save(); ctx.fillStyle = col; for (const [dx, dy, r] of [[-.32, .1, .3], [0, -.15, .38], [.32, .08, .3], [0, .2, .33], [-.5, .25, .2], [.5, .25, .2]]) { ctx.beginPath(); ctx.ellipse(cx + dx * w, cy + dy * h, r * w, r * h * 1.2, 0, 0, 7); ctx.fill(); } ctx.restore(); }
function liveBadge(x, y, s = 1) { ctx.save(); ctx.fillStyle = '#E63946'; rrect(x, y, 120 * s, 46 * s, 12 * s); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 24 * s, y + 23 * s, 8 * s * (.7 + .3 * Math.sin(T * 8)), 0, 7); ctx.fill(); ctx.restore(); text('LIVE', x + 76 * s, y + 25 * s, 28 * s, { color: '#fff' }); }
// a dream picture drawn inside a clipped rect
function dreamPic(x, y, w, h, kind) {
  ctx.save(); rrect(x, y, w, h, Math.min(w, h) * .06); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  const sky = { fly: ['#B5A8FF', '#FFC6E0'], pizza: ['#FFD6A5', '#FFADAD'], cat: ['#A0E7E5', '#B4F8C8'], rainbow: ['#BDE0FE', '#FFFFFF'], storm: ['#2B2D42', '#5C4D7D'] }[kind];
  g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  const cx = x + w / 2, cy = y + h / 2, k = Math.min(w, h) / 400;
  if (kind === 'fly') { cloudShape(x + w * .2, y + h * .75, 160 * k, 70 * k, '#fff'); cloudShape(x + w * .85, y + h * .3, 120 * k, 50 * k, '#fff');
    ctx.save(); ctx.translate(cx + Math.sin(T * 2) * 30 * k, cy + Math.cos(T * 3) * 15 * k); ctx.rotate(-1.2); figure(0, 60 * k, .9 * k, { seed: 11, pose: { armL: [-2.9, -3], armR: [-2.7, -2.9], legL: [.1, .1], legR: [.25, .25] }, mouth: 'smile' }); ctx.restore(); }
  if (kind === 'pizza') { ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(T * 2) * .2); ctx.fillStyle = '#F4A261'; ctx.beginPath(); ctx.moveTo(-110 * k, -90 * k); ctx.lineTo(110 * k, -90 * k); ctx.lineTo(0, 120 * k); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#FFD166'; ctx.beginPath(); ctx.moveTo(-95 * k, -70 * k); ctx.lineTo(95 * k, -70 * k); ctx.lineTo(0, 100 * k); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#E63946'; for (const [a, b] of [[-30, -40], [30, -30], [0, 20]]) { ctx.beginPath(); ctx.arc(a * k, b * k, 18 * k, 0, 7); ctx.fill(); } ctx.restore(); }
  if (kind === 'cat') { ctx.save(); ctx.translate(cx, cy + Math.sin(T * 3) * 10 * k); ctx.fillStyle = '#F4A261'; ctx.beginPath(); ctx.arc(0, 0, 95 * k, 0, 7); ctx.fill(); for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 85 * k, -40 * k); ctx.lineTo(sx * 70 * k, -130 * k); ctx.lineTo(sx * 20 * k, -85 * k); ctx.fill(); }
    ctx.fillStyle = INK; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 35 * k, -10 * k, 11 * k, 0, 7); ctx.fill(); } ctx.beginPath(); ctx.arc(0, 25 * k, 9 * k, 0, 7); ctx.fill(); ctx.restore(); }
  if (kind === 'rainbow') { const cols = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93']; ctx.lineWidth = 26 * k; for (let i = 0; i < 5; i++) { ctx.strokeStyle = cols[i]; ctx.beginPath(); ctx.arc(cx, y + h * .95, (170 - i * 26) * k, Math.PI, 0); ctx.stroke(); } cloudShape(cx - 150 * k, y + h * .9, 120 * k, 50 * k, '#fff'); cloudShape(cx + 150 * k, y + h * .9, 120 * k, 50 * k, '#fff'); }
  if (kind === 'storm') { cloudShape(cx, cy - 40 * k, 300 * k, 110 * k, '#454866'); if (Math.floor(T * 6) % 3 === 0) { ctx.fillStyle = YEL; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 40 * k, cy + 90 * k); ctx.lineTo(cx, cy + 80 * k); ctx.lineTo(cx - 30 * k, cy + 170 * k); ctx.lineTo(cx + 40 * k, cy + 60 * k); ctx.lineTo(cx + 5 * k, cy + 70 * k); ctx.closePath(); ctx.fill(); } }
  ctx.restore();
}
function screenBox(x, y, w, h, kind, live = true) { box(x, y, w, h, 18, '#111'); dreamPic(x + 8, y + 8, w - 16, h - 16, kind); if (live) liveBadge(x + 18, y + 18, Math.max(.55, Math.min(1, w / 500))); }
function phone(x, y, w, h) { ctx.save(); ctx.fillStyle = INK; rrect(x - 18, y - 18, w + 36, h + 36, 60); ctx.fill(); ctx.fillStyle = '#fff'; rrect(x, y, w, h, 44); ctx.fill(); ctx.fillStyle = INK; rrect(x + w / 2 - 60, y + 18, 120, 32, 16); ctx.fill(); ctx.restore(); }
function lyingHero(x, y, s, o) { ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2); figure(0, 0, s, { seed: 11, ...o, pose: { legL: [0, 0], legR: [.05, .05], armL: [-.2, -.1], armR: [.2, .1] } }); ctx.restore(); }
function bedroom(t, tv) {
  ctx.fillStyle = '#2E2A5A'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3F3770'; ctx.fillRect(0, 1290, W, H - 1290);
  box(110, 330, 300, 380, 16, '#14123A', 10);
  ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.arc(300, 440, 50, 0, 7); ctx.fill(); ctx.fillStyle = '#14123A'; ctx.beginPath(); ctx.arc(322, 425, 46, 0, 7); ctx.fill();
  for (let i = 0; i < 9; i++) { const sx = 140 + rnd(i * 3.3) * 240, sy = 360 + rnd(i * 7.1) * 320, tw = .5 + .5 * Math.sin(T * 3 + i); ctx.fillStyle = `rgba(255,255,255,${.4 + .6 * tw})`; ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 7); ctx.fill(); }
  inkPath([[260, 330], [260, 710]], { w: 8 }); inkPath([[110, 520], [410, 520]], { w: 8 });
  // bed
  box(120, 1040, 840, 70, 20, '#8D6E63'); box(120, 980, 40, 280, 10, '#6D4C41'); box(920, 1040, 40, 220, 10, '#6D4C41');
